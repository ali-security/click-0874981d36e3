name: Publish
on:
  # Fork build: dispatched explicitly; the tag-push trigger would fire unbidden
  # on every fork sync.
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
      - uses: actions/setup-python@d27e3f3d7c64b4bbf8e4abfb9b63b83e846e0435
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'
      - run: pip install -r requirements/build.txt
      # Byte-equivalence lever: click has no pyproject.toml, so `python -m build`
      # creates an isolated env from the legacy fallback requirements
      # (setuptools>=40.8.0, wheel) and installs the NEWEST of each. Modern
      # setuptools (>=70) ships its own vendored bdist_wheel, which stamps the
      # wheel's METADATA/WHEEL "Generator:" line as `setuptools (X)` instead of
      # the published `bdist_wheel (0.40.0)`. Pinning the build backend versions
      # through PIP_CONSTRAINT reproduces the exact generator recorded in the
      # published 8.1.6 wheel, without touching upstream's `python -m build`.
      - name: pin build backend versions for byte-equivalence
        run: |
          printf 'setuptools==68.0.0\nwheel==0.40.0\n' > "${RUNNER_TEMP}/build-constraints.txt"
          echo "PIP_CONSTRAINT=${RUNNER_TEMP}/build-constraints.txt" >> $GITHUB_ENV
      # Use the commit date instead of the current date during the build.
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
      - run: python -m build
      # Generate hashes used for provenance.
      - name: generate hash
        id: hash
        run: cd dist && echo "hash=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT
      # v3 (0b7f8ab) is hard-disabled by GitHub since Jan 2025; v4 is required.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          if-no-files-found: error
  provenance:
    # Disabled for the fork build: SLSA provenance needs OIDC signing we don't have.
    if: false
    needs: ['build']
    permissions:
      actions: read
      id-token: write
      contents: write
    # Can't pin with hash due to how this workflow works.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.7.0
    with:
      base64-subjects: ${{ needs.build.outputs.hash }}
  create-release:
    # Upload the sdist, wheels, and provenance to a GitHub release. They remain
    # available as build artifacts for a while as well.
    # Disabled for the fork build: `gh release create` needs release write creds.
    if: false
    needs: ['provenance']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
      - name: create release
        run: >
          gh release create --draft --repo ${{ github.repository }}
          ${{ github.ref_name }}
          *.intoto.jsonl/* artifact/*
        env:
          GH_TOKEN: ${{ github.token }}
  publish-pypi:
    # Disabled for the fork build: PyPI Trusted Publishing creds are not available.
    if: false
    needs: ['provenance']
    # Wait for approval before attempting to upload to PyPI. This allows reviewing the
    # files in the draft release.
    environment: 'publish'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
      # Try uploading to Test PyPI first, in case something fails.
      - uses: pypa/gh-action-pypi-publish@29930c9cf57955dc1b98162d0d8bc3ec80d9e75c
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: artifact/
      - uses: pypa/gh-action-pypi-publish@29930c9cf57955dc1b98162d0d8bc3ec80d9e75c
        with:
          packages-dir: artifact/
